name: Kaohsiung to Yokohama (Ryukyu chain and Kuroshio)
description: >
  Around southern Taiwan, along the Ryukyu chain and the Pacific coast of Japan into Tokyo Bay,
  1,420 nm, ~4.9 days at 12 kn. Kuroshio (one of the strongest ocean currents), winter
  north-east monsoon gales, and typhoons until about November.
# Traced on 2026-10-19 along the World Bank / IMF Global Shipping Traffic Density, commercial
# layer (AIS positions Jan 2015 - Feb 2021, 0.005 deg; CC BY 4.0; Cerdeiro et al. 2020), summed
# to 0.02 deg cells: the cheapest sea path whose cost per NM is 1 on a local traffic ridge (log
# density within 2 orders of magnitude of the maximum within 30 NM) and up to 21 off it, with
# the weight chosen per stretch so the path is at most 5% longer than the shortest sea path; no
# diagonal steps past land corners. Land is Natural Earth 1:10m land and minor islands. The path
# was thinned to rhumb-line legs within 1.5 NM of it near land (up to 6 NM far offshore), each
# leg at least 0.3 NM off land except the harbour approaches (pipeline/tools/routes/README.md).
# Pass-through point (forced): south of Taiwan, so the route rounds Eluanbi instead of taking
# the Taiwan Strait.
