name: Tacoma to Anchorage (Gulf of Alaska), planned from Admiralty Inlet
description: >
  Container and ro-ro route from Puget Sound across the Gulf of Alaska to Cook Inlet, planned
  from Admiralty Inlet (off Port Townsend), 1,418 nm, ~4.9 days at 12 kn. Gulf of Alaska winter
  storm track (Aleutian Low): frequent gales and high seas; strong tidal currents in Cook Inlet.
# Traced on 2026-10-19 along the World Bank / IMF Global Shipping Traffic Density, commercial
# layer (AIS positions Jan 2015 - Feb 2021, 0.005 deg; CC BY 4.0; Cerdeiro et al. 2020), summed
# to 0.02 deg cells: the cheapest sea path whose cost per NM is 1 on a local traffic ridge (log
# density within 2 orders of magnitude of the maximum within 30 NM) and up to 21 off it, with
# the weight chosen per stretch so the path is at most 5% longer than the shortest sea path; no
# diagonal steps past land corners. Land is Natural Earth 1:10m land and minor islands. The path
# was thinned to rhumb-line legs within 1.5 NM of it near land (up to 6 NM far offshore), each
# leg at least 0.3 NM off land except the harbour approaches (pipeline/tools/routes/README.md).
# Pass-through points (forced): Strait of Juan de Fuca entrance and Kennedy Entrance. On the
# Gulf crossing, cells within 20 NM of land count as off-lane (25 NM exempt around those
# points), which keeps the route on the offshore lane instead of the coastal tug and barge
# lanes. The route was traced from Tacoma (47.290, -122.450), but the voyage is planned from the
# traced waypoint in Admiralty Inlet where the currents model (SMOC) has data: it has none in
# Puget Sound (Tacoma to Admiralty Inlet, the first 46 NM; pilotage waters), Tal's choice,
# 2026-10-19.
